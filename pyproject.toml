[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typewriterbot"
version = "0.1.0"
description = "Automates typing exercises on Typewriter"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.14,<5",
    "webdriver-manager>=3.8.6,<4",
    "pynput>=1.7.6,<2",
]

[project.optional-dependencies]
dev = [
    "black>=23.9,<24",
    "flake8>=6.1,<7",
    "pre-commit>=3.5,<4",
    "pytest>=7.4,<8",
]

[project.scripts]
typewriterbot = "typewriterbot.cli:main"
